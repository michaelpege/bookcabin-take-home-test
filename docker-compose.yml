name: bookcabin-flight-aggregator

services:
  api:
    container_name: bookcabin-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      REDIS_ADDR: "redis:6379"
      CACHE_BASE_TTL: "${CACHE_BASE_TTL:-2m}"
      CACHE_PROVIDER_TTL: "${CACHE_PROVIDER_TTL:-5m}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    container_name: bookcabin-redis
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
